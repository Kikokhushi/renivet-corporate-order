<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Renivet Corporate — Preview Harness</title>
<style>
  body{background:#1d1f18;margin:0;padding:24px;font-family:system-ui;color:#eee}
  h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#aaa;margin:0 0 10px}
  .frame-wrap{overflow:hidden;margin-bottom:40px;background:#F0E8D5;border-radius:6px}
  .w1440{width:490px;height:400px}
  .w1440 iframe{width:1440px;height:1176px;transform:scale(.3403);transform-origin:top left;border:0}
  .w390{width:390px;height:844px}
  .w390 iframe{width:390px;height:844px;border:0}
</style>
</head>
<body>
  <h2>Desktop · 1440px (scaled to fit)</h2>
  <div class="frame-wrap w1440"><iframe src="index.html" loading="eager"></iframe></div>
  <h2>Mobile · 390px</h2>
  <div class="frame-wrap w390"><iframe src="index.html" loading="eager"></iframe></div>
</body>
</html>
